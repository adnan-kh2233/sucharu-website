services:
  - type: web
    name: sucharu-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: sucharu-87667
      - key: FIREBASE_DATABASE_URL
        value: https://sucharu-87667-default-rtdb.asia-southeast1.firebasedatabase.app/
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: CUSTOMER_AUTH_MODE
        value: legacy
      - key: CLIENT_URL
        value: http://127.0.0.1:5500,http://localhost:5500,https://sucharu-customer-web-adnan.onrender.com,https://sucharu-87667.web.app
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Sucharu

  - type: web
    name: sucharu-customer-web-adnan
    runtime: static
    buildCommand: node scripts/build-static.js
    staticPublishPath: ./dist
    autoDeployTrigger: commit
